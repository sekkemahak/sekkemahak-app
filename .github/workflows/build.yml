name: Build Flutter APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          mkdir -p temp_backup
          cp pubspec.yaml temp_backup/
          cp -r lib temp_backup/
          flutter create . --org ir.sekkemahak --project-name sekkemahak_app --platforms=android --overwrite
          cp temp_backup/pubspec.yaml .
          cp -r temp_backup/lib .
          flutter pub get

      - name: Set Android Min SDK
        run: |
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sekkemahak-apk
          path: build/app/outputs/flutter-apk/app-release.apk
