name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android project
        run: flutter create . --platforms=android

      - name: Fix Android Build & Proguard
        run: |
          mkdir -p android/app
          touch android/app/proguard-rules.pro
          find android -name "build.gradle*" -exec sed -i "s/getDefaultProguardFile('proguard-android.txt')/file('proguard-rules.pro')/g" {} +
          find android -name "build.gradle*" -exec sed -i "s/getDefaultProguardFile('proguard-android-optimize.txt')/file('proguard-rules.pro')/g" {} +
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion .*/minSdkVersion 21/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/minSdk = .*/minSdk = 21/g' {} +

      - name: Fix InAppWebView API usage
        run: |
          find lib -name "*.dart" -exec sed -i 's/InAppWebViewOptions/InAppWebViewSettings/g' {} +
          find lib -name "*.dart" -exec sed -i 's/crossPlatform:[[:space:]]*InAppWebViewSettings(/InAppWebViewSettings(/g' {} +

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
