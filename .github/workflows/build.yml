name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          mkdir -p temp_backup
          cp pubspec.yaml temp_backup/
          cp -r lib temp_backup/
          flutter create . --org ir.sekkemahak --platforms android
          cp temp_backup/pubspec.yaml .
          cp -r temp_backup/lib .
          flutter pub get

      - name: Fix Gradle and Proguard compatibility
        run: |
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          sed -i 's/getDefaultProguardFile('\''proguard-android.txt'\'')/getDefaultProguardFile('\''proguard-android-optimize.txt'\'')/g' $(find ~/.pub-cache -name "build.gradle" 2>/dev/null) || true

      - name: Set Android Min SDK
        run: |
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
